api:
  image: docker.io/diegoormeno/notes-api
  tag: latest
  pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

web:
  image: docker.io/diegoormeno/notes-web
  tag: latest
  pullPolicy: IfNotPresent
  replicas: 1
  serviceType: NodePort
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 64Mi

mongo:
  storage: 1Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  # Obligatorias: no se guardan en el repo, se pasan al instalar con --set
  rootPassword: ""
  appPassword: ""
