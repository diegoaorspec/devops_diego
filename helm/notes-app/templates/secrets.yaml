apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-mongo-root
stringData:
  MONGO_INITDB_ROOT_USERNAME: {{ .Values.mongo.rootUser | quote }}
  MONGO_INITDB_ROOT_PASSWORD: {{ required "Falta --set mongo.rootPassword=..." .Values.mongo.rootPassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-mongo-app
stringData:
  MONGO_APP_USER: {{ .Values.mongo.appUser | quote }}
  MONGO_APP_PASSWORD: {{ required "Falta --set mongo.appPassword=..." .Values.mongo.appPassword | quote }}
