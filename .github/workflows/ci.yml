name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Configurar en el repo (Settings > Secrets and variables > Actions):
#   variable DOCKERHUB_USERNAME y secret DOCKERHUB_TOKEN (access token de Docker Hub)

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
        working-directory: api
      - run: pytest
        working-directory: api

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: notes-api
            context: api
          - image: notes-web
            context: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Tags: latest (rama main), sha-<commit> y la versión si se pushea un tag v1.2.3
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}

      # En pull requests solo construye (valida el Dockerfile); no publica
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
